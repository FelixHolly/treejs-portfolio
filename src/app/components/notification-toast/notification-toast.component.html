@if (notification()) {
  <div class="fixed top-4 right-4 z-50 max-w-md animate-slide-in">
    <div
      class="text-white rounded-lg shadow-lg p-4 flex items-start gap-3"
      [ngClass]="{
        'bg-red-600': notification()!.type === 'error',
        'bg-green-600': notification()!.type === 'success',
        'bg-blue-600': notification()!.type === 'info',
        'bg-yellow-600': notification()!.type === 'warning'
      }">
      <div class="flex-shrink-0">
        <!-- Error Icon -->
        @if (notification()!.type === 'error') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- Success Icon -->
        @if (notification()!.type === 'success') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- Info Icon -->
        @if (notification()!.type === 'info') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <!-- Warning Icon -->
        @if (notification()!.type === 'warning') {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
      </div>
      <div class="flex-1">
        <h3 class="font-semibold text-sm">{{ notification()!.title }}</h3>
        <p class="text-sm mt-1 opacity-90">{{ notification()!.message }}</p>
      </div>
      <button
        (click)="dismiss()"
        class="flex-shrink-0 text-white hover:text-gray-200 transition-colors"
        [attr.aria-label]="'Dismiss ' + notification()!.type + ' notification'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
}
