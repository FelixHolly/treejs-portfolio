<div role="status" aria-live="polite">
  @if (notification(); as note) {
    <div class="toast" [class.toast--error]="note.type === 'error'" [class.toast--warning]="note.type === 'warning'">
      <svg class="toast-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (note.type) {
          @case ("success") {
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          }
          @case ("warning") {
            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          }
          @case ("error") {
            <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          }
          @default {
            <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          }
        }
      </svg>
      <div class="toast-text">
        <h3>{{ note.title }}</h3>
        <p>{{ note.message }}</p>
      </div>
      <button type="button" class="toast-close" (click)="dismiss()" [attr.aria-label]="'Dismiss ' + note.type + ' notification'">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
