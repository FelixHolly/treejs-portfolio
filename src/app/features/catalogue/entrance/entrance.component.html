<section class="entrance relative w-full min-h-screen flex flex-col justify-between items-center pt-32 pb-10" id="home">
    @if (lion() !== 'failed') {
        <picture class="lion" [class.lion--ready]="lion() === 'ready'">
            <source media="(max-aspect-ratio: 1/1)" srcset="assets/lion-960.webp" width="960" height="1634">
            <img ngSrc="assets/lion-1600.webp" width="1600" height="1125" priority
                 alt="Statue of a Viennese lion, the Vienna Löwe"
                 (load)="lion.set('ready')" (error)="lion.set('failed')">
        </picture>
    }

    <div class="z-10 flex flex-col items-center gap-4 c-space">
        <p class="eyebrow intro-item intro-eyebrow">Full-Stack Developer</p>
        <h1 class="intro-item intro-name font-display font-medium text-bone text-center leading-none text-5xl sm:text-6xl xl:text-8xl">
            Felix Hollndonner
        </h1>
    </div>

    <div class="z-10 w-full max-w-4xl flex flex-col items-center gap-5 c-space">
        <div class="plinth-rule intro-item intro-rule"></div>
        <div class="intro-item intro-row flex flex-col sm:flex-row items-center sm:justify-between w-full gap-3">
            <p class="font-mono text-xs sm:text-sm text-stone tracking-wider">
                Angular · TypeScript · Java · Spring Boot
            </p>
            <a routerLink="/" fragment="works" queryParamsHandling="preserve" class="inline-flex items-center gap-2 min-h-6 font-mono text-xs sm:text-sm text-gold tracking-wider hover:text-bone transition-colors">
                View the works
                <app-icon-arrow-down />
            </a>
        </div>
        <app-view-switch class="lg:hidden" />
    </div>
</section>
