<ul class="nav-ul" [class.nav-ul--sheet]="sheet()">
  @for (item of rooms(); track item.id) {
    @let current = activeId() === item.id;
    <li class="nav-li">
      <a
        routerLink="/"
        [fragment]="item.catalogueId"
        queryParamsHandling="preserve"
        appSectionLink
        class="nav-li_a"
        [class.nav-active]="current"
        [attr.aria-current]="current ? 'location' : null"
        (click)="linkClick.emit()"
      >
        {{ item.plain }}
        @if (sheet() && current) {
          <span class="nav-here" aria-hidden="true">You are here</span>
        }
      </a>
    </li>
  }
</ul>
