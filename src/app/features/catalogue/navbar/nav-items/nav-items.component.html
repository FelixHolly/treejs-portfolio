<ul class="nav-ul">
  @for (item of rooms; track item.id) {
    <li class="nav-li">
      <a
        [href]="'#' + item.catalogueId"
        class="nav-li_a"
        [class.nav-active]="activeId() === item.id"
        [attr.aria-current]="activeId() === item.id ? 'location' : null"
        (click)="linkClick.emit()"
      >
        {{ item.name }}
        @if (item.numeral && activeId() === item.id) {
          <span class="nav-room" aria-hidden="true">{{ item.numeral }}</span>
        }
      </a>
    </li>
  }
</ul>
