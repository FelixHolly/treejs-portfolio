<section class="c-space my-24" id="visitors-book">
    <app-room-label numeral="III" title="Visitors' Book" appReveal />

    @if (companies.length) {
        <div class="board" aria-hidden="true" appReveal>
            <div class="board-face font-display font-medium uppercase">
                @for (company of companies; track company) {
                    <p>{{ company }}</p>
                }
            </div>
        </div>
    }

    <div class="entries">
        @for (entry of entries; track entry.quote) {
            <figure class="entry" appReveal>
                <span class="mark font-display" aria-hidden="true">&ldquo;</span>
                <blockquote class="font-display">{{ entry.quote }}</blockquote>
                <figcaption class="by font-mono">
                    <span>{{ entry.role }}<span class="sr-only">, </span></span>
                    <span class="company">{{ entry.company }}</span>
                </figcaption>
            </figure>
        }
    </div>
</section>
