<section class="c-space my-24" id="projects">
    <span id="works" class="anchor"></span>
    <app-room-label numeral="II" title="The Works" appReveal />

    @for (work of commissions(); track work.slug) {
        <article class="commission" [id]="'works-' + work.slug">
            <div class="triptych" appReveal [revealDelay]="120">
                @for (image of work.images; track image.src) {
                    <app-framed-image [image]="image" [class.triptych-centre]="$first" [sizes]="$first ? '(min-width: 1024px) 60vw, 100vw' : '(min-width: 640px) 45vw, 100vw'" />
                }
            </div>
            <app-wall-label class="max-w-2xl mx-auto mt-10" [work]="work" appReveal [revealDelay]="220" />
        </article>
    }

    <div class="plinth-rule my-16 sm:my-24" appReveal></div>

    <div class="plain-frames">
        @for (work of plainFramed(); track work.slug) {
            @let wide = work.images[0].orientation === 'landscape';
            <article class="plain-work" [id]="'works-' + work.slug" appReveal [revealDelay]="$index * 120">
                <app-framed-image class="plain-frame" [class.plain-frame--wide]="wide" [image]="work.images[0]" variant="plain" [sizes]="wide ? '(min-width: 768px) 22rem, 90vw' : '(min-width: 768px) 14rem, 60vw'" />
                <app-wall-label [work]="work" />
            </article>
        }
    </div>
</section>
