<dialog #dialog class="lightbox" aria-labelledby="lightbox-title" (click)="closeFromBackdrop($event)" (close)="work.set(null)">
  @if (work(); as current) {
    <div class="panel">
      <header>
        <h2 id="lightbox-title" class="font-display text-2xl sm:text-3xl text-bone">{{ current.title }}</h2>
        <button type="button" class="close" (click)="close()" aria-label="Close the closer look">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </header>
      <div class="sheet">
        @for (image of images(); track image.src) {
          <app-framed-image
            [image]="image"
            variant="plain"
            sizes="(min-width: 1024px) 70vw, 94vw"
            [class.portrait]="image.orientation === 'portrait'"
          />
        }
      </div>
    </div>
  }
</dialog>
