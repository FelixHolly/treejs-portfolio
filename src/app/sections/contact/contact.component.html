<section class="c-space my-20" id="contact">
    <div class="flex justify-center">
        <div class="terminal">
            <div class="terminal-body">
                <h3 class="head-text">Let's talk</h3>
                <p class="text-base text-stone mt-3 font-mono">
                    Whether you’re looking to build a new website, improve your existing platform, or bring a unique
                    project to
                    life, I’m here to help.
                </p>
                <form #contactForm="ngForm" (ngSubmit)="handleSubmit()" class="mt-12 flex flex-col space-y-7">
                    <label class="space-y-3">
                        <span class="field-label">Full Name</span>
                        <input
                                name="name"
                                [(ngModel)]="form.name"
                                #nameRef="ngModel"
                                required
                                class="field-input"
                                placeholder="ex., John Doe"
                        />
                        @if (nameRef.invalid && nameRef.touched) {
                            <span class="text-red-500 text-sm">Full name is required</span>
                        }
                    </label>

                    <label class="space-y-3">
                        <span class="field-label">Email address</span>
                        <input
                                type="email"
                                name="email"
                                [(ngModel)]="form.email"
                                #emailRef="ngModel"
                                required
                                email
                                class="field-input"
                                placeholder="ex., johndoe@gmail.com"
                        />
                        @if (emailRef.invalid && emailRef.touched) {
                            <span class="text-red-500 text-sm">Enter a valid email</span>
                        }
                    </label>

                    <label class="space-y-3">
                        <span class="field-label">Your message</span>
                        <textarea
                                name="message"
                                [(ngModel)]="form.message"
                                #messageRef="ngModel"
                                required
                                rows="5"
                                class="field-input"
                                placeholder="Share your thoughts or inquiries..."
                        ></textarea>
                        @if (messageRef.invalid && messageRef.touched) {
                            <span class="text-red-500 text-sm">Message is required</span>
                        }
                    </label>

                    <button class="field-btn" type="submit" [disabled]="loading()" [attr.aria-label]="loading() ? 'Sending message...' : 'Send message'">
                        {{ loading() ? 'Sending...' : 'Send Message' }}
                        <img src="assets/arrow-up.png" alt="" class="field-btn_arrow" aria-hidden="true" loading="lazy"/>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
