<section class="relative w-full min-h-screen flex flex-col justify-between items-center pt-32 pb-10" id="home" [class.intro-go]="!isLoading">
    <div class="z-10 flex flex-col items-center gap-4 c-space">
        <p class="eyebrow intro-item intro-eyebrow">Full-Stack Developer</p>
        <h1 class="intro-item intro-name font-display font-medium text-bone text-center leading-none text-5xl sm:text-6xl xl:text-8xl">
            Felix Hollndonner
        </h1>
    </div>

    <div class="z-10 w-full max-w-4xl flex flex-col items-center gap-5 c-space">
        <div class="plinth-rule intro-item intro-rule"></div>
        <div class="intro-item intro-row flex flex-col sm:flex-row items-center sm:justify-between w-full gap-3">
            <p class="font-mono text-xs sm:text-sm text-stone tracking-wider">
                Angular · TypeScript · Java · Spring Boot
            </p>
            <a href="#projects" class="font-mono text-xs sm:text-sm text-gold tracking-wider hover:text-bone transition-colors">
                View my work ↓
            </a>
        </div>
    </div>

    <div class="loading-overlay" [class.loading-overlay--done]="!isLoading" [attr.aria-hidden]="!isLoading">
        <div class="flex flex-col justify-center items-center gap-5 font-mono">
            <p class="text-xs uppercase tracking-[0.3em] text-stone">The gallery is opening</p>
            <div class="load-rule" role="progressbar" aria-label="Loading the exhibit" [attr.aria-valuenow]="Math.round(loadingProgress)" aria-valuemin="0" aria-valuemax="100">
                <span [style.width.%]="loadingProgress"></span>
            </div>
        </div>
    </div>
    <canvas #canvas class="absolute inset-0 w-full h-full z-0 pointer-events-none" role="img" aria-label="3D model of a Viennese lion statue, the Vienna Löwe"></canvas>
</section>
