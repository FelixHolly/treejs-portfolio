<a href="#home" class="skip-link">Skip to main content</a>
<header class="fixed top-0 left-0 right-0 z-50 bg-graphite/90 backdrop-blur-sm border-b border-graphite-700/60">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center py-5 mx-auto c-space">
      <a href="/#home" class="font-display text-bone text-2xl tracking-wide hover:text-gold transition-colors">
        Felix Hollndonner
      </a>

      <!-- Mobile Toggle -->
      <button
        (click)="isOpen = !isOpen"
        class="text-stone hover:text-bone sm:hidden flex"
        [attr.aria-label]="isOpen ? 'Close navigation menu' : 'Open navigation menu'"
        [attr.aria-expanded]="isOpen">
        <img
          [src]="isOpen ? 'assets/close.svg' : 'assets/menu.svg'"
          alt=""
          class="w-6 h-6"
          aria-hidden="true"
        />
      </button>

      <!-- Desktop Nav -->
      <nav class="sm:flex hidden">
        <app-nav-items></app-nav-items>
      </nav>
    </div>
  </div>

  <!-- Mobile Nav -->
  <div [ngClass]="{ 'max-h-screen': isOpen, 'max-h-0 overflow-hidden': !isOpen }" class="transition-all duration-300 sm:hidden">
    <nav class="p-5">
      <app-nav-items (linkClick)="isOpen = false"></app-nav-items>
    </nav>
  </div>
</header>
