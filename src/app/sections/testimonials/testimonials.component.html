<section class="c-space my-24">
    <div class="room-label">
        <p class="room-number">Room III</p>
        <h2 class="head-text">Visitors' Book</h2>
        <span class="room-rule" aria-hidden="true"></span>
    </div>

    <div class="client-container">
        @for (item of clientReviews; track item.name) {
            <div class="client-review">
                <div>
                    <span class="font-display text-gold text-5xl leading-none block mb-2" aria-hidden="true">&ldquo;</span>
                    <p class="text-bone font-light">{{ item.review }}</p>

                    <div class="client-content">
                        <div class="flex items-center gap-3">
                            <span class="h-px w-6 bg-gold" aria-hidden="true"></span>
                            <div class="flex flex-col">
                                <p class="font-semibold text-bone">{{ item.name }}</p>
                                <p class="text-stone md:text-base text-sm font-mono uppercase tracking-wider">{{ item.position }}</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        }
    </div>
</section>
