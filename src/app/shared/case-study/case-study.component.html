@for (section of sections(); track section.heading) {
    <section class="max-w-[68ch]">
        @if (headingLevel() === 3) {
            <h3 class="font-mono text-[0.7rem] uppercase tracking-[0.18em] text-gold">{{ section.heading }}</h3>
        } @else {
            <h4 class="font-mono text-[0.7rem] uppercase tracking-[0.18em] text-gold">{{ section.heading }}</h4>
        }
        <p class="mt-2 text-bone/90 leading-relaxed">{{ section.text }}</p>
    </section>
}
