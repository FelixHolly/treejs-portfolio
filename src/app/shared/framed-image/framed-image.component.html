<figure>
    <div class="frame" [class.frame--gilded]="variant() === 'gilded'" [class.frame--plain]="variant() === 'plain'">
        <div class="mat">
            <div class="picture" [class.picture--portrait]="image().orientation === 'portrait'" [class.picture--toned]="toned()" [style.aspect-ratio]="aspect()">
                <img [ngSrc]="image().src" [alt]="image().alt" fill [sizes]="sizes()">
            </div>
        </div>
    </div>
    @if (image().caption; as caption) {
        <figcaption class="exhibit-caption">{{ caption }}</figcaption>
    }
</figure>
