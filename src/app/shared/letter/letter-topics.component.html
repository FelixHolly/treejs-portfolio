<span id="letter-re" class="re">Re:<span class="sr-only"> what your letter is about, if you like</span></span>
@for (topic of topics(); track topic.word) {
    @if (!$first) {
        <span class="slash" aria-hidden="true">/</span>
    }
    <label class="topic">
        <input type="radio" class="sr-only" name="letter-topic" [formControl]="control()" [value]="topic.word" (change)="chose.emit(topic)">
        <span class="word">
            {{ topic.word }}
            <svg class="circle" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
                <path [attr.d]="circles[$index % circles.length]" />
            </svg>
        </span>
    </label>
}
<span class="hint" aria-hidden="true">(circle one, if you like)</span>
